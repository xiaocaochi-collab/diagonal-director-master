function home(){project=null;path='';$('search').value='';history.replaceState(null,'','#');refresh()}
function enter(p,next=''){project=p;path=next;$('search').value='';history.replaceState(null,'','#'+encodeURIComponent(p.id)+'/'+encodeURIComponent(next));refresh()}
function updateHeader(){const inProject=!!project;$('categoryNav').hidden=!inProject;$('homeNav').classList.toggle('active',!inProject);$('newProject').hidden=inProject;$('deleteProject').hidden=!inProject||!!path;$('newFolder').hidden=!inProject||!path;$('uploadBtn').hidden=!inProject||!path;$('dropHint').hidden=!inProject||!path;$('search').placeholder=inProject?'搜索当前文件夹及子文件夹…':'搜索项目…';$('heading').textContent=inProject?(path.split('/').pop()||project.title):'我的项目';$('eyebrow').textContent=inProject?(path?'PROJECT FILES':'PROJECT OVERVIEW'):'YOUR FILM LIBRARY';const type=path.split('/')[0];$('subtitle').textContent=!inProject?'把每一部作品的素材，放在一起。':!path?'按内容分类，按场次归档。':type==='正式分镜'?'各场正式分镜，由导演大师自动归档。':type==='提示词'?'找到对应场次，查看、复制或修改提示词。':['人物资产','场景资产','道具资产'].includes(type)?'上传图片和视频，用文件夹整理你的素材。':'全片分析、情绪曲线与其他创作成果。';$('crumbs').replaceChildren();const b=el('button','quiet','全部项目');b.onclick=home;$('crumbs').append(b);if(project){const add=(text,next)=>{$('crumbs').append(el('span','','/'));const btn=el('button','quiet',text);btn.onclick=()=>enter(project,next);$('crumbs').append(btn)};add(project.title,'');let parts=[];for(const part of path.split('/').filter(Boolean)){parts.push(part);add(part,parts.join('/'))}}document.querySelectorAll('#categories .nav').forEach((b,i)=>b.classList.toggle('active',type===CATS[i]))}
async function refresh(){const serial=++refreshSerial;updateHeader();$('count').textContent='正在读取…';try{let items;if(!project){const d=await api('/api/projects');projects=d.projects;root=d.root;items=projects.filter(p=>p.title.toLowerCase().includes($('search').value.toLowerCase())).map((p,i)=>({...p,type:'project',name:p.title,number:i+1}));}else{const d=await api('/api/list?'+params({q:$('search').value}));items=d.items;if(d.truncated)toast('结果较多，请缩小搜索范围')}if(serial!==refreshSerial)return;currentItems=items;render(items);$('count').textContent=items.length+(project?' 项内容':' 个项目')}catch(e){toast(e.message,true);$('count').textContent='读取失败，请刷新重试'}}
function render(items){$('files').replaceChildren();if(!items.length){const empty=el('div','empty');empty.append(icon('folder'),el('h2','', $('search').value?'没有找到匹配内容':project?'这里还没有文件':'开始你的第一部作品'),el('p','', $('search').value?'试试其他名称，或返回上一级查找。':project?(path?'你可以上传素材、创建子文件夹，或让导演大师把成果保存到这里。':'项目内容会显示在这里。'):'创建一个项目，把分镜、提示词和人物、场景、道具素材分门别类地放好。'));if(!$('search').value){const button=el('button','primary',project?'上传文件':'＋ 新建项目');button.onclick=project?()=>$('fileInput').click():createProject;button.hidden=!!project&&!path;empty.append(button)}$('files').append(empty);return}for(const item of items){const tile=el('article','tile '+item.type);const main=el('button','tile-main');main.setAttribute('aria-label','打开 '+item.name);main.onclick=()=>item.type==='project'?enter(item):item.type==='folder'?enter(project,item.path):openPreview(item);const thumb=el('div','thumb '+item.type);if(item.type==='image'){const img=el('img');img.alt=item.name;img.loading='lazy';img.src=urlFor(item);img.onerror=()=>{img.remove();thumb.append(icon('image'))};thumb.append(img)}else if(item.type==='project'){thumb.append(el('span','',String(item.number).padStart(2,'0')),icon('folder'))}else if(item.type==='video'){videoThumb(thumb,item)}else{thumb.append(icon(item.type==='folder'?'folder':item.type==='text'?'file':item.type==='audio'?'play':'file'))}const details=el('div','tile-info');const name=el('span','filename',item.name);name.title=item.name;details.append(name);const meta=item.type==='project'?'分镜 · 提示词 · 影像素材':item.type==='folder'?'文件夹':formatSize(item.size)+' · '+new Date(item.modified*1000).toLocaleDateString('zh-CN');details.append(el('span','filemeta',meta));main.append(thumb,details);tile.append(main);if(item.type==='project'||!CATS.includes(item.path)){const more=el('button','more','⋯');more.setAttribute('aria-label','管理 '+item.name);more.onclick=e=>showMenu(e,item);tile.append(more)}$('files').append(tile)}}
async function createProject(){const title=await ask('新建项目','项目名称','','例如：雨夜来信');if(!title)return;try{const p=await api('/api/create-project',{title});enter(p);toast('项目已创建')}catch(e){toast(e.message,true)}}
async function removeProject(item){const answer=await ask('移到项目回收站','输入项目名称以确认','',`项目：${item.title}。资产库内创建的项目会连同文件移入回收站；外部接入的项目只从列表移除，原文件留在原位置。`);if(answer===null)return;if(answer!==item.title){toast('项目名称不一致，未移除',true);return}try{const d=await api('/api/delete-project',{project:item.id});home();toast(d.files_moved?'项目及文件已移到项目回收站':'项目已从列表移除，原文件仍在原位置')}catch(e){toast(e.message,true)}}
async function showProjectTrash(){try{const d=await api('/api/project-trash');const container=el('div');if(!d.projects.length)container.append(el('p','','项目回收站是空的。'));for(const item of d.projects){const row=el('div','trash-row'),desc=el('div','',item.title);desc.append(el('small','',new Date(item.deleted_at).toLocaleString('zh-CN')+' · '+(item.path===item.original_path?'原文件保留在原位置':'项目文件已移入回收站')));const b=el('button','','恢复项目');b.onclick=async()=>{try{const restored=await api('/api/restore-project',{project:item.id});$('infoDialog').close();enter(restored);toast('项目已恢复')}catch(e){toast(e.message,true)}};row.append(desc,b);container.append(row)}info('项目回收站',container)}catch(e){toast(e.message,true)}}
async function newFolder(){const name=await ask('新建文件夹','文件夹名称','','例如：第01场_客厅，或人物、场景名称');if(!name)return;try{await api('/api/mkdir',{project:project.id,path,name});await refresh();toast('文件夹已创建')}catch(e){toast(e.message,true)}}
async function upload(files){if(!project||!path){toast('请先进入项目中的目标文件夹',true);return}const location={project:project.id,path};$('uploadBtn').disabled=true;let success=0;try{for(const file of files){$('uploadState').textContent='正在上传 '+(success+1)+' / '+files.length;const r=await fetch('/api/upload?'+new URLSearchParams({...location,name:file.name}),{method:'PUT',headers:{'X-Diagonal-Token':TOKEN},body:file});const d=await r.json();if(!r.ok)throw Error(file.name+'：'+d.error);success++}toast(success+' 个文件已上传')}catch(e){toast('已完成 '+success+' 个；'+e.message,true)}finally{$('uploadBtn').disabled=false;$('uploadState').textContent='';$('fileInput').value='';refresh()}}
function showMenu(e,item){e.stopPropagation();const menu=$('menu');menu.replaceChildren();const entries=item.type==='project'?[['移到项目回收站',()=>removeProject(item)]]:[['重命名',()=>rename(item)],['移动到…',()=>move(item)],['移到回收站',()=>remove(item)]];for(const [text,action] of entries){const b=el('button',text.includes('回收站')?'danger':'',text);b.onclick=()=>{menu.hidden=true;action()};menu.append(b)}menu.style.left=Math.min(e.clientX,innerWidth-180)+'px';menu.style.top=Math.min(e.clientY,innerHeight-150)+'px';menu.hidden=false}
async function rename(item){const name=await ask('重命名','新的名称',item.name);if(!name||name===item.name)return;const destination=item.path.split('/').slice(0,-1).concat(name).join('/');await relocate(item,destination)}
async function move(item){const destination=await ask('移动文件或文件夹','目标路径（包含文件名）',item.path,'从项目分类开始填写，例如：人物资产/林雪/正面.png。目标文件夹须已存在。');if(!destination||destination===item.path)return;await relocate(item,destination)}
async function relocate(item,destination){try{await api('/api/move',{project:project.id,path:item.path,destination});refresh();toast('已移动')}catch(e){toast(e.message,true)}}
async function remove(item){if(!confirm('将“'+item.name+'”移到回收站？之后可以恢复。'))return;try{await api('/api/delete',{project:project.id,path:item.path});refresh();toast('已移到回收站')}catch(e){toast(e.message,true)}}
async function showTrash(){try{const d=await api('/api/trash?'+params());const container=el('div');if(!d.items.length)container.append(el('p','','回收站是空的。'));for(const item of d.items){const row=el('div','trash-row'),desc=el('div','',item.path);desc.append(el('small','',new Date(item.time).toLocaleString('zh-CN')));const b=el('button','','恢复');b.onclick=async()=>{try{await api('/api/restore',{project:project.id,id:item.id});$('infoDialog').close();refresh();toast('已恢复')}catch(e){toast(e.message,true)}};row.append(desc,b);container.append(row)}info('回收站',container)}catch(e){toast(e.message,true)}}
async function openPreview(item){previewItem=item;$('previewTitle').textContent=item.name;$('previewContent').replaceChildren();$('copyBtn').hidden=true;$('saveBtn').hidden=true;$('previewStatus').textContent='';$('previewNote').textContent=item.path;$('preview').showModal();try{if(item.type==='text'){const d=await api('/api/text?'+params({path:item.path}));if(!$('preview').open||previewItem!==item)return;textHash=d.hash;originalText=d.text;const area=el('textarea');area.id='textEditor';area.setAttribute('aria-label','文件内容');area.value=d.text;area.oninput=()=>{$('saveBtn').disabled=area.value===originalText;$('previewStatus').textContent=area.value===originalText?'':'有未保存修改'};$('previewContent').append(area);$('copyBtn').hidden=false;$('saveBtn').hidden=false;$('saveBtn').disabled=true}else if(['image','video','audio'].includes(item.type)){const media=el(item.type==='image'?'img':item.type);media.src=urlFor(item);if(item.type==='image')media.alt=item.name;else media.controls=true;media.onerror=()=>{$('previewStatus').textContent='浏览器无法预览此格式，请下载后查看。'};$('previewContent').append(media)}else{const content=el('div','empty');content.append(icon('file'),el('h2','','下载后查看'),el('p','','此文件保留原始格式，可以下载到本机打开。'));$('previewContent').append(content)}}catch(e){$('previewContent').append(el('p','',e.message));toast(e.message,true)}}
function closePreview(){const area=$('textEditor');if(area&&area.value!==originalText&&!confirm('放弃未保存的修改？'))return;$('preview').close();$('previewContent').replaceChildren();previewItem=null}
$('preview').addEventListener('cancel',e=>{e.preventDefault();closePreview()});$('closePreview').onclick=closePreview;
$('saveBtn').onclick=async()=>{try{const text=$('textEditor').value;const d=await api('/api/save',{project:project.id,path:previewItem.path,text,hash:textHash});textHash=d.hash;originalText=text;$('saveBtn').disabled=true;$('previewStatus').textContent='已保存';toast('修改已保存，原版本已保留');refresh()}catch(e){toast(e.message,true)}};
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('textEditor').value);toast('已复制全文')}catch{toast('复制失败，可选中文字后手动复制',true)}};
$('historyBtn').onclick=async()=>{if(!previewItem)return;try{const d=await api('/api/history?'+params({path:previewItem.path}));const content=el('div');if(!d.items.length)content.append(el('p','','暂无历史版本。'));for(const item of d.items){const row=el('div','trash-row');const detail=el('div','', '版本 '+item.version);detail.append(el('small','',new Date(item.created).toLocaleString('zh-CN')+' · '+({draft:'草稿',recorded:'已保存',confirmed:'已确认',final:'已定稿',needs_review:'待复核',archived:'已归档'}[item.status]||item.status)));const button=el('button','','下载');button.onclick=()=>{const a=el('a');a.href='/api/history-file?'+params({path:previewItem.path,revision:item.id});a.click()};row.append(detail,button);content.append(row)}info('历史版本 · '+previewItem.name,content)}catch(e){toast(e.message,true)}};
$('downloadBtn').onclick=()=>{if(previewItem){const a=el('a');a.href=urlFor(previewItem,true);a.click()}};
$('homeNav').append(icon('folder'),document.createTextNode('全部项目'));$('homeNav').onclick=home;CATS.forEach((name,i)=>{const b=el('button','nav');b.append(icon(icons[i]),document.createTextNode(name));b.onclick=()=>enter(project,name);$('categories').append(b)});
$('newProject').onclick=createProject;$('deleteProject').onclick=()=>removeProject(project);$('projectTrashBtn').onclick=showProjectTrash;$('newFolder').onclick=newFolder;$('uploadBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=()=>upload([...$('fileInput').files]);$('refreshBtn').onclick=refresh;$('trashBtn').onclick=showTrash;$('closeInfo').onclick=()=>$('infoDialog').close();$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(refresh,220)};
$('gridBtn').onclick=()=>{$('files').classList.remove('list');$('gridBtn').classList.add('selected');$('listBtn').classList.remove('selected')};$('listBtn').onclick=()=>{$('files').classList.add('list');$('listBtn').classList.add('selected');$('gridBtn').classList.remove('selected')};$('storageBtn').onclick=()=>{const c=el('div');c.append(el('p','','所有文件保存在这台电脑上：'),el('p','storage',root));const b=el('button','','复制路径');b.onclick=async()=>{try{await navigator.clipboard.writeText(root);toast('路径已复制')}catch{toast('请选中路径后复制',true)}};c.append(b);info('保存位置',c)};
function applyTheme(theme){document.documentElement.dataset.theme=theme;$('themeBtn').textContent=theme==='dark'?'切换浅色外观':'切换深色外观';try{localStorage.setItem('diagonal-theme',theme)}catch{}}
let savedTheme='dark';try{savedTheme=localStorage.getItem('diagonal-theme')||'dark'}catch{}applyTheme(savedTheme==='light'?'light':'dark');const toggleTheme=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');$('themeBtn').onclick=toggleTheme;$('mobileThemeBtn').onclick=toggleTheme;
document.addEventListener('click',()=>$('menu').hidden=true);document.addEventListener('dragover',e=>{e.preventDefault();if(project&&path)$('files').classList.add('drop-active')});document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('files').classList.remove('drop-active')});document.addEventListener('drop',e=>{e.preventDefault();$('files').classList.remove('drop-active');if(e.dataTransfer.files.length)upload([...e.dataTransfer.files])});
window.addEventListener('focus',()=>{if(!$('preview').open&&!$('formDialog').open)refresh()});
(async()=>{try{const d=await api('/api/projects');projects=d.projects;root=d.root;const h=location.hash.slice(1).split('/');if(h[0]){const id=decodeURIComponent(h[0]);project=projects.find(p=>p.id===id)||null;path=project?decodeURIComponent(h[1]||''):''}await refresh()}catch(e){toast(e.message,true)}})();
</script></body></html>
